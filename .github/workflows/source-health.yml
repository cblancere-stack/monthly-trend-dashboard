name: Check direct data connections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/direct_sources.py'
      - 'scripts/update_report.py'
      - '.github/workflows/source-health.yml'
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      # No Gemini key: deterministic official-source adapters only.
      - name: Probe public source adapters without changing saved reports
        run: python scripts/update_report.py --check-only
