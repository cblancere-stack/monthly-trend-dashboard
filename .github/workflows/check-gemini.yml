name: Check Gemini connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-gemini.yml', 'scripts/check_gemini.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check API key and model access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/check_gemini.py
