name: Collect and publish monthly report
on:
  schedule:
    # Korea time: first three days of every month, 09:17. Publish previous month.
    - cron: '17 0 1-3 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Report month (YYYY-MM); leave empty for automatic selection'
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: monthly-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate collectors and existing snapshots
        run: python -m unittest discover -s tests -v
      - name: Collect official sources
        id: collect
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          REPORT_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REPORT_MONTH" ]; then
            python scripts/update_report.py --month "$REPORT_MONTH"
          else
            python scripts/update_report.py
          fi
      - name: Validate generated reports
        run: python -m unittest discover -s tests -v
      - name: Preserve report history
        run: |
          git config user.name 'monthly-dashboard-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update monthly report from official sources'
            git push
          fi
      # Pushes using GITHUB_TOKEN do not trigger a second workflow: deploy here.
      - name: Stage public files
        run: |
          mkdir -p public
          cp index.html public/
          cp -r assets data public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Surface collection failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Some or all sources could not be collected. Existing values are preserved. See data/status.json.'
          exit 1
